<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="サウナ室">
  <!-- オリジナル背景「サウナ室」。作者: このリポジトリ（MIT） -->
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a3620"/><stop offset=".6" stop-color="#8a5a34"/><stop offset="1" stop-color="#6b4226"/>
    </linearGradient>
    <linearGradient id="bench" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d9a86c"/><stop offset="1" stop-color="#a8733f"/>
    </linearGradient>
    <radialGradient id="lamp" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffd28a" stop-opacity=".9"/><stop offset="1" stop-color="#ffb04a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="stoveglow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ff7a2e" stop-opacity=".75"/><stop offset="1" stop-color="#ff4d1a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="planks" width="60" height="1600" patternUnits="userSpaceOnUse">
      <rect width="60" height="1600" fill="url(#wall)"/>
      <rect x="0" width="3" height="1600" fill="#3a2212" opacity=".7"/>
      <rect x="28" width="1" height="1600" fill="#b07a4a" opacity=".25"/>
    </pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="28"/></filter>
  </defs>
  <rect width="900" height="1600" fill="url(#planks)"/>
  <!-- 天井のライン -->
  <rect width="900" height="120" fill="#3a2212"/>
  <rect y="120" width="900" height="10" fill="#2a180c"/>
  <!-- 照明 -->
  <circle cx="450" cy="330" r="230" fill="url(#lamp)"/>
  <rect x="400" y="300" width="100" height="60" rx="14" fill="#f2c27a" stroke="#6b4226" stroke-width="8"/>
  <path d="M410 316 H490 M410 332 H490 M410 348 H490" stroke="#6b4226" stroke-width="5"/>
  <!-- 温度計 -->
  <circle cx="720" cy="420" r="62" fill="#f5ead9" stroke="#3a2212" stroke-width="10"/>
  <path d="M720 420 L752 382" stroke="#d9480f" stroke-width="8" stroke-linecap="round"/>
  <circle cx="720" cy="420" r="8" fill="#3a2212"/>
  <g stroke="#3a2212" stroke-width="4"><path d="M720 366 V378"/><path d="M774 420 H762"/><path d="M666 420 H678"/><path d="M758 382 L750 390"/></g>
  <!-- 砂時計 -->
  <g transform="translate(150 380)">
    <rect x="0" y="0" width="70" height="12" rx="4" fill="#3a2212"/>
    <rect x="0" y="120" width="70" height="12" rx="4" fill="#3a2212"/>
    <path d="M10 12 L60 12 L38 66 L60 120 L10 120 L32 66 Z" fill="#fff3dc" opacity=".8"/>
    <path d="M22 120 L48 120 L35 96 Z" fill="#e2a33c"/>
  </g>
  <!-- 3段ベンチ -->
  <g>
    <rect x="0" y="760" width="900" height="44" fill="url(#bench)"/>
    <rect x="0" y="804" width="900" height="150" fill="#6b4226"/>
    <rect x="0" y="954" width="900" height="44" fill="url(#bench)"/>
    <rect x="0" y="998" width="900" height="170" fill="#5c381f"/>
    <rect x="0" y="1168" width="900" height="44" fill="url(#bench)"/>
    <rect x="0" y="1212" width="900" height="388" fill="#4a2d18"/>
    <g stroke="#3a2212" stroke-width="3" opacity=".6">
      <path d="M0 782 H900 M0 976 H900 M0 1190 H900"/>
    </g>
  </g>
  <!-- ストーブとサウナストーン -->
  <circle cx="160" cy="1180" r="260" fill="url(#stoveglow)"/>
  <rect x="40" y="1060" width="240" height="300" rx="16" fill="#2b2522"/>
  <rect x="40" y="1060" width="240" height="300" rx="16" fill="none" stroke="#4a403b" stroke-width="8"/>
  <path d="M60 1110 H260 M60 1150 H260" stroke="#3d3531" stroke-width="6"/>
  <g>
    <ellipse cx="90" cy="1056" rx="36" ry="24" fill="#6e6a66"/>
    <ellipse cx="150" cy="1046" rx="40" ry="28" fill="#85807a"/>
    <ellipse cx="214" cy="1054" rx="38" ry="25" fill="#6e6a66"/>
    <ellipse cx="120" cy="1026" rx="30" ry="20" fill="#9a948d"/>
    <ellipse cx="186" cy="1022" rx="32" ry="21" fill="#7b7671"/>
    <ellipse cx="150" cy="1004" rx="26" ry="17" fill="#a6a098"/>
  </g>
  <rect x="120" y="1250" width="80" height="50" rx="8" fill="#ff6b35" opacity=".85"/>
  <!-- 桶と柄杓 -->
  <g transform="translate(640 1070)">
    <path d="M0 0 H140 L126 110 H14 Z" fill="#c98d52" stroke="#6b4226" stroke-width="6"/>
    <path d="M6 30 H134 M10 76 H130" stroke="#3a2212" stroke-width="7"/>
    <path d="M100 -6 L190 -120" stroke="#b07a4a" stroke-width="10" stroke-linecap="round"/>
    <ellipse cx="80" cy="4" rx="34" ry="12" fill="#8fc6e8" opacity=".7"/>
  </g>
  <!-- 湯気 -->
  <g fill="#fff8ef" filter="url(#blur)">
    <ellipse cx="160" cy="900" rx="140" ry="90" opacity=".22"/>
    <ellipse cx="520" cy="640" rx="220" ry="120" opacity=".12"/>
    <ellipse cx="780" cy="880" rx="160" ry="90" opacity=".14"/>
  </g>
</svg>
