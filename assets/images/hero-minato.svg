<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 560" role="img" aria-label="ミナト">
  <!-- オリジナルキャラクター「ミナト」: サウナハットの常連。作者: このリポジトリ（MIT） -->
  <defs>
    <linearGradient id="gown" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b4f7e"/><stop offset="1" stop-color="#1a3252"/>
    </linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbf4e4"/><stop offset="1" stop-color="#dccfb4"/>
    </linearGradient>
    <linearGradient id="skin" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7d2b0"/><stop offset="1" stop-color="#eab58f"/>
    </linearGradient>
    <linearGradient id="towel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7cc6ee"/><stop offset="1" stop-color="#4fa3d6"/>
    </linearGradient>
  </defs>
  <!-- 胴体（作務衣風のサウナガウン） -->
  <path d="M40 560 C44 450 92 392 200 384 C308 392 356 450 360 560 Z" fill="url(#gown)"/>
  <path d="M200 392 L160 560 M200 392 L240 560" stroke="#132640" stroke-width="6" opacity=".55"/>
  <path d="M118 470 L118 560 M282 470 L282 560" stroke="#3d6aa0" stroke-width="4" opacity=".6"/>
  <!-- 首 -->
  <path d="M168 330 L232 330 L236 398 C220 414 180 414 164 398 Z" fill="#e2a883"/>
  <!-- 首のタオル -->
  <path d="M112 404 C150 376 250 376 288 404 C296 422 290 440 276 446 C240 420 160 420 124 446 C110 440 104 422 112 404 Z" fill="url(#towel)"/>
  <path d="M124 446 C132 480 132 520 128 548 L164 548 C168 512 166 474 158 438 Z" fill="url(#towel)"/>
  <path d="M130 470 L160 466 M130 490 L162 486" stroke="#ffffff" stroke-width="5" opacity=".75"/>
  <!-- 顔 -->
  <path d="M112 212 C112 132 152 100 200 100 C248 100 288 132 288 212 C288 290 250 346 200 346 C150 346 112 290 112 212 Z" fill="url(#skin)"/>
  <ellipse cx="112" cy="232" rx="16" ry="24" fill="#eab58f"/>
  <ellipse cx="288" cy="232" rx="16" ry="24" fill="#eab58f"/>
  <!-- 前髪 -->
  <path d="M122 170 C136 196 158 206 176 204 C170 196 168 186 170 178 C186 198 214 206 240 202 C232 194 230 186 232 178 C248 196 268 200 278 196 L282 158 L118 158 Z" fill="#3a2a22"/>
  <!-- サウナハット -->
  <path d="M96 176 C96 88 144 40 200 40 C256 40 304 88 304 176 C304 186 296 190 286 186 C258 172 142 172 114 186 C104 190 96 186 96 176 Z" fill="url(#hat)"/>
  <path d="M84 186 C120 164 280 164 316 186 C322 196 316 206 304 204 C262 190 138 190 96 204 C84 206 78 196 84 186 Z" fill="#e9dcc0"/>
  <path d="M150 64 C140 96 136 130 138 168" stroke="#cdbd9c" stroke-width="4" fill="none"/>
  <path d="M250 64 C260 96 264 130 262 168" stroke="#cdbd9c" stroke-width="4" fill="none"/>
  <circle cx="200" cy="44" r="10" fill="#e9dcc0"/>
  <!-- 眉 -->
  <path d="M146 222 L184 214" stroke="#3a2a22" stroke-width="7" stroke-linecap="round"/>
  <path d="M254 222 L216 214" stroke="#3a2a22" stroke-width="7" stroke-linecap="round"/>
  <!-- 目 -->
  <ellipse cx="166" cy="252" rx="14" ry="17" fill="#221812"/>
  <ellipse cx="234" cy="252" rx="14" ry="17" fill="#221812"/>
  <circle cx="171" cy="245" r="5" fill="#fff"/>
  <circle cx="239" cy="245" r="5" fill="#fff"/>
  <circle cx="162" cy="259" r="2.5" fill="#fff" opacity=".7"/>
  <circle cx="230" cy="259" r="2.5" fill="#fff" opacity=".7"/>
  <!-- 頬 -->
  <ellipse cx="146" cy="290" rx="16" ry="9" fill="#f08a78" opacity=".35"/>
  <ellipse cx="254" cy="290" rx="16" ry="9" fill="#f08a78" opacity=".35"/>
  <!-- 鼻・口 -->
  <path d="M198 270 L194 286 L204 286" stroke="#c98a66" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M182 312 C194 320 210 320 222 310" stroke="#8a4a36" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- 汗 -->
  <path d="M282 150 C290 164 294 172 294 178 C294 186 288 190 282 190 C276 190 270 186 270 178 C270 172 274 164 282 150 Z" fill="#bfe6ff" stroke="#6bb7e6" stroke-width="2"/>
</svg>
