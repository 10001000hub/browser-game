name: 不具合
description: ゲームが動かない・表示が崩れるなど
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: 何が起きたか
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現の手順
      placeholder: "1. 店を選ぶ\n2. ..."
  - type: input
    id: env
    attributes:
      label: 端末とブラウザ
      placeholder: "例: iPhone / Safari"
